name: Build Artifacts

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release --split-per-abi

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: nbox-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 5

      - name: Upload ARMv7 APK
        uses: actions/upload-artifact@v4
        with:
          name: nbox-arm32
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 5

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: nbox-x64
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 5

  release-android:
    needs: build-android
    runs-on: ubuntu-latest
    if: needs.build-android.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Download all APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release
        run: |
          mkdir -p artifacts
          cd artifacts
          mv app-*-v8a-release.apk nbox-1.0.0-arm64-v8a-release.apk 2>/dev/null || true
          mv app-*-armeabi-v7a-release.apk nbox-1.0.0-armeabi-v7a-release.apk 2>/dev/null || true
          mv app-*-x86_64-release.apk nbox-1.0.0-x86_64-release.apk 2>/dev/null || true
          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0
          name: Nbox v1.0.0 Release
          draft: false
          prerelease: false
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: nbox-windows
          path: build/windows/runner/Release
          retention-days: 5
