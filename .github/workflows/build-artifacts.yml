name: Build Artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Build Android APK
        run: flutter build apk --release -o releases/nbox-1.0.0.apk
      
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: nbox-android-apk
          path: releases/nbox-1.0.0.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Build Windows
        run: flutter build windows --release -o releases/nbox-windows
      
      - name: Rename exe
        shell: bash
        run: mv releases/nbox-windows/runner/*.exe releases/nbox-windows/nbox-1.0.0.exe 2>/dev/null || true
      
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: nbox-windows-exe
          path: releases/nbox-windows/nbox-1.0.0.exe
      
      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: nbox-windows-zip
          path: releases/nbox-windows.zip
