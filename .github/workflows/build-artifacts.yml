name: Build Artifacts

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: |
          set +e
          flutter build apk --release --split-per-abi 2>&1 | tee build.log
          exit_code=${PIPESTATUS[0]}
          echo "Build exit code: $exit_code"
          if [ $exit_code -ne 0 ]; then
            echo "=== Build failed, showing last 100 lines of log ==="
            tail -100 build.log
          fi
          exit $exit_code

      - name: Show output
        if: always()
        run: |
          ls -la build/app/outputs/flutter-apk/ 2>/dev/null || echo "No APK output directory"
          cat build.log 2>/dev/null | tail -50 || echo "No log file"

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nbox-apks
          path: build/app/outputs/flutter-apk/
          retention-days: 5

  release-android:
    needs: build-android
    runs-on: ubuntu-latest
    if: needs.build-android.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: nbox-apks
          path: artifacts

      - name: Prepare Release
        run: |
          cd artifacts
          ls -la
          for f in *.apk; do
            newname=""
            case "$f" in
              *arm64*|*v8a*) newname="nbox-1.0.0-$f" ;;
              *armeabi*) newname="nbox-1.0.0-$f" ;;
              *x86_64*) newname="nbox-1.0.0-$f" ;;
            esac
            if [ -n "$newname" ] && [ -f "$f" ]; then
              mv "$f" "$newname"
            fi
          done
          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0
          name: Nbox v1.0.0 Release
          draft: false
          prerelease: false
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: |
          $ErrorActionPreference = "Continue"
          flutter build windows --release 2>&1 | Tee-Object -File build.log
          $exit_code = $LASTEXITCODE
          Write-Host "Build exit code: $exit_code"
          if ($exit_code -ne 0) {
            Write-Host "=== Build failed ==="
            Get-Content build.log | Select-Object -Last 100
          }
          exit $exit_code

      - name: Show output
        if: always()
        run: |
          ls build\windows\runner\Release 2>$null || echo "No output directory"

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nbox-windows
          path: build/windows/runner/Release
          retention-days: 5
