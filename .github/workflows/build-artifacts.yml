name: Build Artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release --split-per-abi

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: nbox-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 5

      - name: Upload ARMv7 APK
        uses: actions/upload-artifact@v4
        with:
          name: nbox-arm32
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 5

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: nbox-x64
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 5

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: nbox-windows
          path: build/windows/runner/Release
          retention-days: 5

  release:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download ARM64 APK
        uses: actions/download-artifact@v4
        with:
          name: nbox-arm64
          path: artifacts

      - name: Download ARMv7 APK
        uses: actions/download-artifact@v4
        with:
          name: nbox-arm32
          path: artifacts

      - name: Download x86_64 APK
        uses: actions/download-artifact@v4
        with:
          name: nbox-x64
          path: artifacts

      - name: Download Windows
        uses: actions/download-artifact@v4
        with:
          name: nbox-windows
          path: artifacts

      - name: Prepare Release
        run: |
          cd artifacts
          for f in *.apk; do mv "$f" "nbox-1.0.0-$f"; done
          mv nbox-windows nbox-1.0.0-windows
          cd nbox-1.0.0-windows
          for f in *.exe; do mv "$f" "nbox-1.0.0-$f"; done
          cd ..
          ls -la
          ls -la nbox-1.0.0-windows

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0
          name: Nbox v1.0.0 Release
          draft: false
          prerelease: false
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
