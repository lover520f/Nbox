name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Phone APK
        run: flutter build apk --release

      - name: Rename Phone APK
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/niuhe-phone-${VERSION}.apk

      - name: Upload Phone APK
        uses: actions/upload-artifact@v4
        with:
          name: niuhe-phone-apk
          path: build/app/outputs/flutter-apk/niuhe-phone-*.apk
          retention-days: 5

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package Windows
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          cd build/windows/x64/runner/Release
          Compress-Archive -Path * -DestinationPath "../../../../../niuhe-pc-$version.zip"
          cd ../../../../../
        shell: pwsh

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: niuhe-windows
          path: niuhe-pc-*.zip
          retention-days: 5

  create-release:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    if: always() && needs.build-android.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Download Phone APK
        uses: actions/download-artifact@v4
        with:
          name: niuhe-phone-apk
          path: artifacts

      - name: Download Windows
        uses: actions/download-artifact@v4
        with:
          name: niuhe-windows
          path: artifacts
        continue-on-error: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: 牛盒 ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
